version: 2
updates:
  # Python dependencies via pip (pyproject.toml)
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:00"
    pull-request-branch-name:
      separator: "/"
    commit-message:
      prefix: "chore(deps):"
      include: "scope"
    # Limit the number of open PRs
    open-pull-requests-limit: 5
    # Group related dependencies
    groups:
      # Group all non-dev dependencies separately from dev dependencies
      production:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
      dev:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
      # Group major updates together but limit them
      major-updates:
        update-types:
          - "major"
      # Group critical security updates with high priority
      security:
        applies-to: security-updates
    # Rebase PRs if they become out of date
    rebase-strategy: "auto"
    # Ignore certain packages if needed (none for now, but structure is here)
    ignore: []
      # Add any packages you want to ignore here
      # - dependency-name: "package-name"
