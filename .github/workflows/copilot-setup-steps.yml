# Pre-installs the toolchain for GitHub Copilot's coding agent so it can run
# the checks in AGENTS.md (ruff, pyright, pytest) without bootstrapping first.
# The job name MUST be `copilot-setup-steps` — Copilot looks it up by name.
name: Copilot Setup Steps

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/copilot-setup-steps.yml'
  pull_request:
    paths:
      - '.github/workflows/copilot-setup-steps.yml'

permissions:
  contents: read

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3.2.4
        with:
          enable-cache: true
      - run: uv sync --locked
