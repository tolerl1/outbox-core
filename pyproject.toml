[project]
name = "outbox-core"
version = "0.1.0"
description = "A broker-agnostic transactional outbox for SQLAlchemy (async) + Postgres."
readme = "README.md"
license = "MIT"
authors = [
    { name = "Logan Toler", email = "log@ntoler.dev" }
]
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "pydantic>=2.0",
]
keywords = [
    "outbox",
    "transactional-outbox",
    "sqlalchemy",
    "postgres",
    "asyncio",
    "message-queue",
    "event-driven",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3 :: Only",
    "Framework :: AsyncIO",
    "Typing :: Typed",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Distributed Computing",
]

[project.urls]
Homepage = "https://github.com/tolerl1/outbox-core"
Documentation = "https://tolerl1.github.io/outbox-core/"
Repository = "https://github.com/tolerl1/outbox-core"
Issues = "https://github.com/tolerl1/outbox-core/issues"
Changelog = "https://github.com/tolerl1/outbox-core/blob/main/CHANGELOG.md"

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "outbox"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.26",
    "ruff>=0.7",
    "pyright>=1.1.380",
    "commitizen>=3.29",
]
docs = [
    "zensical>=0.0.51",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = [
    "integration: requires a real Postgres — set OUTBOX_TEST_DATABASE_URL",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "RUF", "ASYNC"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "strict"
pythonVersion = "3.12"

[tool.commitizen]
name = "cz_conventional_commits"
version = "0.1.0"
version_files = ["pyproject.toml:version"]
tag_format = "v$version"
update_changelog_on_bump = true
major_version_zero = true
